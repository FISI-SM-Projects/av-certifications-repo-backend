spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${APP_ENV:dev}
spring.application.name=gestion-docente-fisi
server.port=${SERVER_PORT:8080}
app.storage.root=${APP_STORAGE_ROOT:storage}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger}
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/api-docs}

# LDAP configurations
ldap.url=${LDAP_URL:ldap://localhost:53389}
ldap.base.dn=${LDAP_BASE_DN:dc=unmsm,dc=edu,dc=pe}
ldap.manager.dn=${LDAP_MANAGER_DN:}
ldap.manager.password=${LDAP_MANAGER_PASSWORD:}
ldap.user.search.base=${LDAP_USER_SEARCH_BASE:ou=Facultad de Ingenieria de Sistemas e Informatica}
ldap.user.search.filter=${LDAP_USER_SEARCH_FILTER:(uid={0})}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# DATABASE
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:av-database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
