spring.config.import=optional:file:.env[.properties]
spring.application.name=gestion-docente-fisi
server.port=${SERVER_PORT:8080}
app.storage.root=${APP_STORAGE_ROOT:storage}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger}
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/api-docs}
